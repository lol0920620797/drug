    (() => {
      window.addEventListener("hashchange", () => {
        const nextHash = new URLSearchParams(window.location.hash.slice(1));
        if (nextHash.get("qrUpload")) window.location.reload();
      });
      const hash = new URLSearchParams(window.location.hash.slice(1));
      const sessionId = hash.get("qrUpload");
      if (!sessionId) return;
      window.__qrUploadBootstrap = { sessionId, encodedKey: hash.get("key") || "" };
      history.replaceState(null, "", `${window.location.pathname}${window.location.search}`);
    })();
  </script>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyBI6nbcytrLY15EUi8CBVGDK6GNlgPhSD4",
        authDomain: "druglistapp-9590d.firebaseapp.com",
        projectId: "druglistapp-9590d"
      };
      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();
      const drugsRef = db.collection("drugs");
      const photoUploadSessionsRef = db.collection("photoUploadSessions");

      const ALLOWED_IMAGE_TYPES = new Set(["image/jpeg", "image/png", "image/webp"]);
      const MAX_SOURCE_IMAGE_BYTES = 10 * 1024 * 1024;
      const MAX_STORED_IMAGE_LENGTH = 600000;
      const QR_SESSION_DURATION_MS = 10 * 60 * 1000;
      const QR_SESSION_ID_PATTERN = /^[a-f0-9]{32}$/;
      const MAX_QR_CIPHERTEXT_BYTES = 500000;
      const SEARCH_FIELDS = [
        "name",
        "indication",
        "sideEffect",
        "specialInstruction",
        "storage",
        "emergencyGuideline"
      ];
      const ADD_FORM_FIELD_IDS = [...SEARCH_FIELDS];

      let drugCache = [];
      let selectedIds = new Set();
      let selectedImageData = "";
      let imageProcessingToken = 0;
      let isImageProcessing = false;
      let isAddingDrug = false;
      let activeQrTransferCleanup = null;
      let mobileQrSessionRef = null;
      let mobileQrSessionId = "";
      let mobileQrKey = "";
      let mobileQrExpiresAt = 0;
      let mobileImageData = "";
      let mobileImageProcessingToken = 0;
      let isMobileImageProcessing = false;
      let isMobileUploading = false;

      function formatBytes(bytes) {
        if (bytes < 1024) return `${bytes} B`;
        if (bytes < 1024 * 1024) return `${Math.round(bytes / 1024)} KB`;
        return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
      }

      function estimateDataUrlBytes(dataUrl) {
        const base64 = String(dataUrl).split(",")[1] || "";
        return Math.floor(base64.length * 3 / 4);
      }

      function friendlyError(error) {
        const code = String(error?.code || "");
        if (code.includes("permission-denied")) return "目前沒有資料庫寫入權限，請檢查 Firebase 規則。";
        if (code.includes("unavailable")) return "目前無法連線到資料庫，請確認網路後再試一次。";
        return error?.message || "發生未預期的錯誤，請稍後再試。";
      }

      function requireSecureCrypto() {
        if (!window.crypto?.getRandomValues || !window.crypto?.subtle) {
          throw new Error("此瀏覽器不支援安全的 QR 照片傳輸，請改用最新版 Chrome、Edge 或 Safari。");
        }
      }

      function bytesToHex(bytes) {
        return [...bytes].map(value => value.toString(16).padStart(2, "0")).join("");
      }

      function bytesToBinaryString(bytes) {
        let binary = "";
        const chunkSize = 0x8000;
        for (let offset = 0; offset < bytes.length; offset += chunkSize) {
          binary += String.fromCharCode(...bytes.subarray(offset, offset + chunkSize));
        }
        return binary;
      }

      function bytesToBase64Url(bytes) {
        return btoa(bytesToBinaryString(bytes))
          .replace(/\+/g, "-")
          .replace(/\//g, "_")
          .replace(/=+$/g, "");
      }

      function base64UrlToBytes(value) {
        if (!/^[A-Za-z0-9_-]+$/.test(value)) throw new Error("QR Code 加密金鑰格式錯誤。");
        const base64 = value.replace(/-/g, "+").replace(/_/g, "/");
        const padded = base64 + "=".repeat((4 - base64.length % 4) % 4);
        const binary = atob(padded);
        return Uint8Array.from(binary, character => character.charCodeAt(0));
      }

      function dataUrlToImageBytes(dataUrl) {
        const match = String(dataUrl).match(/^data:(image\/(?:jpeg|png|webp));base64,([A-Za-z0-9+/=]+)$/i);
        if (!match) throw new Error("照片資料格式錯誤。");
        const binary = atob(match[2]);
        return {
          mimeType: match[1].toLowerCase(),
          bytes: Uint8Array.from(binary, character => character.charCodeAt(0))
        };
      }

      function imageBytesToDataUrl(bytes, mimeType) {
        if (!ALLOWED_IMAGE_TYPES.has(mimeType)) throw new Error("照片格式不受支援。");
        const dataUrl = `data:${mimeType};base64,${btoa(bytesToBinaryString(bytes))}`;
        if (dataUrl.length > MAX_STORED_IMAGE_LENGTH) throw new Error("收到的照片超過大小限制。");
        return dataUrl;
      }

      async function importQrEncryptionKey(encodedKey, usage) {
        requireSecureCrypto();
        const rawKey = base64UrlToBytes(encodedKey);
        if (rawKey.length !== 32) throw new Error("QR Code 加密金鑰長度錯誤。");
        return crypto.subtle.importKey("raw", rawKey, { name: "AES-GCM" }, false, [usage]);
      }

      function createQrAdditionalData(sessionId) {
        if (!QR_SESSION_ID_PATTERN.test(sessionId)) throw new Error("QR Code 工作階段格式錯誤。");
        return new TextEncoder().encode(`drug-photo-upload:v1:${sessionId}`);
      }

      async function encryptQrImage(dataUrl, encodedKey, sessionId) {
        const { mimeType, bytes } = dataUrlToImageBytes(dataUrl);
        if (mimeType !== "image/jpeg") throw new Error("QR Code 僅接受壓縮後的 JPEG 照片。");
        if (!bytes.length || bytes.length > MAX_QR_CIPHERTEXT_BYTES - 16) {
          throw new Error("照片超過 QR Code 傳送大小限制。");
        }
        const key = await importQrEncryptionKey(encodedKey, "encrypt");
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const encrypted = new Uint8Array(await crypto.subtle.encrypt({
          name: "AES-GCM",
          iv,
          additionalData: createQrAdditionalData(sessionId),
          tagLength: 128
        }, key, bytes));
        return {
          ciphertext: firebase.firestore.Blob.fromUint8Array(encrypted),
          iv: firebase.firestore.Blob.fromUint8Array(iv)
        };
      }

      async function decryptQrImage(sessionData, encodedKey, sessionId) {
        if (!sessionData?.ciphertext?.toUint8Array || !sessionData?.iv?.toUint8Array) {
          throw new Error("收到的加密照片資料不完整。");
        }
        const key = await importQrEncryptionKey(encodedKey, "decrypt");
        const iv = sessionData.iv.toUint8Array();
        if (iv.length !== 12) throw new Error("收到的加密照片資料格式錯誤。");
        const ciphertext = sessionData.ciphertext.toUint8Array();
        if (!ciphertext.length || ciphertext.length > MAX_QR_CIPHERTEXT_BYTES) {
          throw new Error("收到的加密照片超過大小限制。");
        }
        const decrypted = new Uint8Array(await crypto.subtle.decrypt(
          {
            name: "AES-GCM",
            iv,
            additionalData: createQrAdditionalData(sessionId),
            tagLength: 128
          },
          key,
          ciphertext
        ));
        return imageBytesToDataUrl(decrypted, "image/jpeg");
      }

      function loadImageFile(file) {
        return new Promise((resolve, reject) => {
          const objectUrl = URL.createObjectURL(file);
          const image = new Image();
          image.onload = () => {
            URL.revokeObjectURL(objectUrl);
            resolve(image);
          };
          image.onerror = () => {
            URL.revokeObjectURL(objectUrl);
            reject(new Error("無法讀取這張圖片，檔案可能已損壞。"));
          };
          image.src = objectUrl;
        });
      }

      function encodeImage(image, width, height, quality) {
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const context = canvas.getContext("2d");
        if (!context) throw new Error("此瀏覽器無法處理圖片。請改用最新版 Chrome、Edge 或 Safari。");

        context.fillStyle = "#ffffff";
        context.fillRect(0, 0, width, height);
        context.imageSmoothingEnabled = true;
        context.imageSmoothingQuality = "high";
        context.drawImage(image, 0, 0, width, height);
        return canvas.toDataURL("image/jpeg", quality);
      }

      async function compressImage(file) {
        if (!file || file.size === 0) throw new Error("請選擇有效的圖片檔案。");
        if (!ALLOWED_IMAGE_TYPES.has(file.type)) throw new Error("只支援 JPG、PNG 或 WebP 圖片。");
        if (file.size > MAX_SOURCE_IMAGE_BYTES) throw new Error("圖片不可超過 10 MB。");

        const image = await loadImageFile(file);
        if (!image.naturalWidth || !image.naturalHeight) throw new Error("圖片尺寸無效。");

        const maxDimension = 1280;
        const scale = Math.min(1, maxDimension / Math.max(image.naturalWidth, image.naturalHeight));
        let width = Math.max(1, Math.round(image.naturalWidth * scale));
        let height = Math.max(1, Math.round(image.naturalHeight * scale));
        let dataUrl = "";

        for (const quality of [0.84, 0.74, 0.64, 0.54]) {
          dataUrl = encodeImage(image, width, height, quality);
          if (dataUrl.length <= MAX_STORED_IMAGE_LENGTH) break;
        }

        while (dataUrl.length > MAX_STORED_IMAGE_LENGTH && Math.max(width, height) > 360) {
          width = Math.max(1, Math.round(width * 0.82));
          height = Math.max(1, Math.round(height * 0.82));
          dataUrl = encodeImage(image, width, height, 0.62);
        }

        if (dataUrl.length > MAX_STORED_IMAGE_LENGTH) {
          throw new Error("圖片壓縮後仍然太大，請改用尺寸較小的圖片。");
        }

        return {
          dataUrl,
          width,
          height,
          bytes: estimateDataUrlBytes(dataUrl)
        };
      }

      function updateAddButton() {
        const button = document.getElementById("addDrugButton");
        const qrButton = document.getElementById("qrAddPhotoButton");
        button.disabled = isImageProcessing || isAddingDrug;
        button.textContent = isImageProcessing ? "處理照片中…" : isAddingDrug ? "新增中…" : "新增藥物";
        qrButton.disabled = isImageProcessing || isAddingDrug;
      }

      function updateAddImagePreview(dataUrl) {
        const preview = document.getElementById("preview");
        const placeholder = document.getElementById("imagePlaceholder");
        const clearButton = document.getElementById("clearImageButton");
        if (dataUrl) preview.src = dataUrl;
        else preview.removeAttribute("src");
        preview.hidden = !dataUrl;
        placeholder.hidden = Boolean(dataUrl);
        clearButton.hidden = !dataUrl;
      }

      function clearSelectedImage() {
        imageProcessingToken += 1;
        selectedImageData = "";
        isImageProcessing = false;
        document.getElementById("imageFile").value = "";
        document.getElementById("imageStatus").textContent = "";
        updateAddImagePreview("");
        updateAddButton();
      }

      async function previewImage(event) {
        const file = event.target.files?.[0];
        if (!file) {
          clearSelectedImage();
          return;
        }

        const token = ++imageProcessingToken;
        selectedImageData = "";
        isImageProcessing = true;
        document.getElementById("imageStatus").textContent = "正在處理照片…";
        updateAddImagePreview("");
        updateAddButton();

        try {
          const result = await compressImage(file);
          if (token !== imageProcessingToken) return;
          selectedImageData = result.dataUrl;
          updateAddImagePreview(selectedImageData);
          document.getElementById("imageStatus").textContent =
            `已壓縮為 ${result.width} × ${result.height}（約 ${formatBytes(result.bytes)}）`;
        } catch (error) {
          if (token !== imageProcessingToken) return;
          selectedImageData = "";
          event.target.value = "";
          updateAddImagePreview("");
          document.getElementById("imageStatus").textContent = "";
          await Swal.fire("照片無法使用", friendlyError(error), "warning");
        } finally {
          if (token === imageProcessingToken) {
            isImageProcessing = false;
            updateAddButton();
          }
        }
      }

      function createQrTransferCredentials() {
        requireSecureCrypto();
        return {
          sessionId: bytesToHex(crypto.getRandomValues(new Uint8Array(16))),
          encodedKey: bytesToBase64Url(crypto.getRandomValues(new Uint8Array(32)))
        };
      }

      function buildQrUploadUrl(sessionId, encodedKey) {
        const url = new URL(window.location.href);
        url.search = "";
        const hash = new URLSearchParams();
        hash.set("qrUpload", sessionId);
        hash.set("key", encodedKey);
        url.hash = hash.toString();
        return url.toString();
      }

      function createQrDialogContent(uploadUrl, targetLabel) {
        const wrapper = document.createElement("div");

        const instructions = document.createElement("p");
        instructions.className = "mb-2";
        instructions.textContent = `請用手機掃描下方 QR Code，為「${targetLabel}」拍照或選擇照片。`;

        const securityNote = document.createElement("p");
        securityNote.className = "small text-secondary mb-3";
        securityNote.textContent = "照片會在手機端壓縮並加密，請保持此視窗開啟。";

        const qrBox = document.createElement("div");
        qrBox.className = "qr-code-box mb-3";
        qrBox.setAttribute("aria-label", "手機上傳 QR Code");

        const status = document.createElement("div");
        status.className = "alert alert-info py-2 mb-2";
        status.setAttribute("role", "status");
        status.setAttribute("aria-live", "polite");
        status.textContent = "等待手機上傳照片…";

        const countdown = document.createElement("div");
        countdown.className = "small text-secondary mb-2";

        const fallback = document.createElement("a");
        fallback.href = uploadUrl;
        fallback.target = "_blank";
        fallback.rel = "noopener noreferrer";
        fallback.className = "small";
        fallback.textContent = "無法掃描？開啟手機上傳連結";

        wrapper.append(instructions, securityNote, qrBox, status, countdown, fallback);
        return { wrapper, qrBox, status, countdown };
      }

      async function startQrPhotoTransfer({ targetLabel, onImageReceived, successMessage }) {
        try {
          requireSecureCrypto();

          if (activeQrTransferCleanup) await activeQrTransferCleanup();

          const { sessionId, encodedKey } = createQrTransferCredentials();
          const uploadUrl = buildQrUploadUrl(sessionId, encodedKey);
          const sessionRef = photoUploadSessionsRef.doc(sessionId);
          const expiresAt = Date.now() + QR_SESSION_DURATION_MS;

          await sessionRef.set({
            schemaVersion: 1,
            status: "pending",
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            expiresAt: firebase.firestore.Timestamp.fromMillis(expiresAt)
          });

          const view = createQrDialogContent(uploadUrl, targetLabel);
          let active = true;
          let applyingImage = false;
          let disposed = false;
          let unsubscribe = () => { };
          let countdownTimer = null;
          const ownsQrModal = () => Boolean(Swal.getHtmlContainer()?.contains(view.wrapper));

          const dispose = async (deleteSession = true) => {
            if (disposed) return;
            disposed = true;
            active = false;
            unsubscribe();
            if (countdownTimer) clearInterval(countdownTimer);
            if (activeQrTransferCleanup === dispose) activeQrTransferCleanup = null;
            if (deleteSession) {
              sessionRef.delete().catch(error => {
                console.warn("清除 QR 上傳工作階段失敗", error);
              });
            }
          };
          activeQrTransferCleanup = dispose;

          const updateCountdown = () => {
            if (!active) return;
            const remainingSeconds = Math.max(0, Math.ceil((expiresAt - Date.now()) / 1000));
            const minutes = String(Math.floor(remainingSeconds / 60)).padStart(2, "0");
            const seconds = String(remainingSeconds % 60).padStart(2, "0");
            view.countdown.textContent = `QR Code 剩餘有效時間：${minutes}:${seconds}`;
            if (remainingSeconds === 0) {
              dispose(true).then(() => {
                if (ownsQrModal()) Swal.fire("QR Code 已過期", "請重新產生新的 QR Code。", "warning");
              });
            }
          };
          updateCountdown();
          countdownTimer = setInterval(updateCountdown, 1000);

          unsubscribe = sessionRef.onSnapshot(async snapshot => {
            if (!active || applyingImage || !snapshot.exists) return;
            const sessionData = snapshot.data() || {};
            if (sessionData.status !== "uploaded") return;
            const uploadedExpiresAt = sessionData.expiresAt?.toMillis?.() || 0;
            if (sessionData.schemaVersion !== 1 || !uploadedExpiresAt || Date.now() >= uploadedExpiresAt) {
              await dispose(true);
              if (ownsQrModal()) Swal.fire("QR Code 已失效", "請重新產生新的 QR Code。", "warning");
              return;
            }
            applyingImage = true;
            view.status.className = "alert alert-info py-2 mb-2";
            view.status.textContent = "照片已收到，正在解密並套用…";

            let imageData;
            try {
              imageData = await decryptQrImage(sessionData, encodedKey, sessionId);
            } catch (error) {
              console.warn("拒絕無效的 QR 照片資料", error);
              await dispose(true);
              if (ownsQrModal()) {
                Swal.fire("照片驗證失敗", "傳送內容無法驗證，請重新產生 QR Code。", "error");
              }
              return;
            }

            if (!active) return;
            try {
              await onImageReceived(imageData);
              if (!active) return;
              await dispose(true);
              if (ownsQrModal()) Swal.fire("手機上傳成功", successMessage, "success");
            } catch (error) {
              console.error("套用手機上傳照片失敗", error);
              if (!active) return;
              await dispose(true);
              if (ownsQrModal()) Swal.fire("照片套用失敗", friendlyError(error), "error");
            }
          }, async error => {
            console.error("監聽 QR 上傳工作階段失敗", error);
            if (!active) return;
            await dispose(true);
            if (ownsQrModal()) Swal.fire("QR 上傳失敗", friendlyError(error), "error");
          });

          Swal.fire({
            title: "手機掃碼上傳照片",
            html: view.wrapper,
            width: 560,
            showConfirmButton: false,
            showCancelButton: true,
            cancelButtonText: "取消",
            allowOutsideClick: false,
            allowEscapeKey: true,
            didOpen: () => {
              try {
                new QRCode(view.qrBox, {
                  text: uploadUrl,
                  width: 220,
                  height: 220,
                  colorDark: "#000000",
                  colorLight: "#ffffff",
                  correctLevel: QRCode.CorrectLevel.M
                });
                const qrImage = view.qrBox.querySelector("img");
                if (qrImage) qrImage.alt = "手機上傳 QR Code";
              } catch (error) {
                console.error("產生 QR Code 失敗", error);
                view.status.className = "alert alert-danger py-2 mb-2";
                view.status.textContent = "QR Code 產生失敗，請使用下方連結。";
              }
            },
            didDestroy: () => {
              if (active) void dispose(true);
            }
          }).then(() => {
            if (active) dispose(true);
          });
        } catch (error) {
          console.error("建立 QR 上傳工作階段失敗", error);
          if (activeQrTransferCleanup) await activeQrTransferCleanup();
          activeQrTransferCleanup = null;
          await Swal.fire("無法建立 QR Code", friendlyError(error), "error");
        }
      }

      async function initializeMobileQrUpload(sessionId, encodedKey) {
        document.getElementById("mainApp").hidden = true;
        document.getElementById("qrUploadPage").hidden = false;
        document.title = "手機上傳藥物照片";

        try {
          requireSecureCrypto();
          if (!QR_SESSION_ID_PATTERN.test(sessionId)) throw new Error("QR Code 工作階段格式錯誤。");
          const keyBytes = base64UrlToBytes(encodedKey);
          if (keyBytes.length !== 32) throw new Error("QR Code 加密金鑰格式錯誤。");

          const sessionRef = photoUploadSessionsRef.doc(sessionId);
          const snapshot = await sessionRef.get();
          if (!snapshot.exists) throw new Error("這個 QR Code 已失效或已被取消。");

          const data = snapshot.data() || {};
          const expiresAt = data.expiresAt?.toMillis?.() || 0;
          if (data.schemaVersion !== 1) throw new Error("QR Code 版本不受支援，請在電腦上重新產生。");
          if (data.status !== "pending") throw new Error("這個 QR Code 已經使用過，請在電腦上重新產生。");
          if (!expiresAt || Date.now() >= expiresAt) throw new Error("這個 QR Code 已過期，請在電腦上重新產生。");

          mobileQrSessionRef = sessionRef;
          mobileQrSessionId = sessionId;
          mobileQrKey = encodedKey;
          mobileQrExpiresAt = expiresAt;
          document.getElementById("mobileUploadControls").hidden = false;
          setMobileSessionMessage("QR Code 驗證成功，請拍照或從相簿選擇照片。", "success");
          updateMobileUploadButton();
        } catch (error) {
          console.error("初始化手機 QR 上傳頁失敗", error);
          document.getElementById("mobileUploadControls").hidden = true;
          setMobileSessionMessage(friendlyError(error), "danger");
        }
      }

      async function previewMobileQrImage(event) {
        const file = event.target.files?.[0];
        if (!file) {
          mobileImageData = "";
          updateMobilePhotoPreview("");
          document.getElementById("mobileImageStatus").textContent = "";
          updateMobileUploadButton();
          return;
        }

        const token = ++mobileImageProcessingToken;
        mobileImageData = "";
        isMobileImageProcessing = true;
        updateMobilePhotoPreview("");
        document.getElementById("mobileImageStatus").className = "small text-secondary mb-3";
        document.getElementById("mobileImageStatus").textContent = "正在縮小並壓縮照片…";
        updateMobileUploadButton();

        try {
          const result = await compressImage(file);
          if (token !== mobileImageProcessingToken) return;
          mobileImageData = result.dataUrl;
          updateMobilePhotoPreview(mobileImageData);
          document.getElementById("mobileImageStatus").textContent =
            `已準備 ${result.width} × ${result.height}（約 ${formatBytes(result.bytes)}）`;
        } catch (error) {
          if (token !== mobileImageProcessingToken) return;
          event.target.value = "";
          mobileImageData = "";
          updateMobilePhotoPreview("");
          document.getElementById("mobileImageStatus").className = "small text-danger mb-3";
          document.getElementById("mobileImageStatus").textContent = friendlyError(error);
        } finally {
          if (token === mobileImageProcessingToken) {
            isMobileImageProcessing = false;
            updateMobileUploadButton();
          }
        }
      }

      async function submitMobileQrImage() {
        if (!mobileQrSessionRef || !mobileQrSessionId || !mobileQrKey) {
          return setMobileSessionMessage("QR Code 工作階段不存在，請重新掃描。", "danger");
        }
        if (!mobileImageData || isMobileImageProcessing || isMobileUploading) return;
        if (Date.now() >= mobileQrExpiresAt) {
          document.getElementById("mobileUploadControls").hidden = true;
          return setMobileSessionMessage("QR Code 已過期，請在電腦上重新產生。", "warning");
        }

        isMobileUploading = true;
        updateMobileUploadButton();
        document.getElementById("mobileImageStatus").className = "small text-secondary mb-3";
        document.getElementById("mobileImageStatus").textContent = "正在加密照片並傳送…";

        try {
          const encrypted = await encryptQrImage(mobileImageData, mobileQrKey, mobileQrSessionId);
          await db.runTransaction(async transaction => {
            const snapshot = await transaction.get(mobileQrSessionRef);
            if (!snapshot.exists) throw new Error("QR Code 已被取消，請在電腦上重新產生。");
            const data = snapshot.data() || {};
            const expiresAt = data.expiresAt?.toMillis?.() || 0;
            if (data.schemaVersion !== 1) throw new Error("QR Code 版本不受支援，請在電腦上重新產生。");
            if (data.status !== "pending") throw new Error("已有其他手機完成上傳，這個 QR Code 無法再次使用。");
            if (!expiresAt || Date.now() >= expiresAt) throw new Error("QR Code 已過期，請在電腦上重新產生。");

            transaction.update(mobileQrSessionRef, {
              status: "uploaded",
              ciphertext: encrypted.ciphertext,
              iv: encrypted.iv,
              uploadedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
          });

          document.getElementById("mobileUploadButton").disabled = true;
          document.getElementById("mobileUploadButton").textContent = "上傳完成";
          document.getElementById("mobileImageFile").disabled = true;
          document.getElementById("mobileImageStatus").className = "small text-success mb-3";
          document.getElementById("mobileImageStatus").textContent = "照片已安全傳送，請查看電腦畫面。";
          setMobileSessionMessage("上傳成功！現在可以關閉這個頁面。", "success");
          mobileQrSessionRef = null;
          mobileQrKey = "";
        } catch (error) {
          console.error("手機 QR 照片上傳失敗", error);
          document.getElementById("mobileImageStatus").className = "small text-danger mb-3";
          document.getElementById("mobileImageStatus").textContent = friendlyError(error);
        } finally {
          isMobileUploading = false;
          if (mobileQrSessionRef) updateMobileUploadButton();
        }
      }

      function toggleAll(checked) {
        const checkboxes = document.querySelectorAll("#drugList input[type='checkbox'][data-id]");
        checkboxes.forEach(checkbox => {
          checkbox.checked = checked;
          const id = checkbox.dataset.id;
          if (checked) selectedIds.add(id);
          else selectedIds.delete(id);
        });
        updateSelectAllState();
      }

      function toggleSelect(id, checked) {
        if (checked) selectedIds.add(id);
        else selectedIds.delete(id);
        updateSelectAllState();
      }

      function updateSelectAllState() {
        const selectAll = document.getElementById("selectAll");
        const checkboxes = [...document.querySelectorAll("#drugList input[type='checkbox'][data-id]")];
        const checkedCount = checkboxes.filter(checkbox => checkbox.checked).length;
        selectAll.checked = checkboxes.length > 0 && checkedCount === checkboxes.length;
        selectAll.indeterminate = checkedCount > 0 && checkedCount < checkboxes.length;
      }

      function getDrugImage(data) {
        const source = String(data?.image || data?.imageUrl || "");
        if (/^data:image\/(?:jpeg|png|webp);base64,/i.test(source)) return source;
        if (/^https:\/\//i.test(source)) return source;
        return "";
      }

        row.appendChild(cell);

        if (!source) return;

          imageAlt: `${name || "藥物"}照片`,
          imageWidth: 520,
          showCloseButton: true,
          showConfirmButton: false
        });

      function createPhotoCell(data) {
        const cell = document.createElement("td");

          empty.className = "text-secondary small";

          cell.appendChild(empty);

        button.type = "button";

        button.title = "查看大圖";
        button.addEventListener("click", () => showImage(source, data.name));

        image.className = "table-photo";
        image.src = source;
        image.alt = `${data.name || "藥物"}照片`;
        image.loading = "lazy";
        button.appendChild(image);
        cell.appendChild(button);

      function renderDrugs() {
        const keyword = document.getElementById("searchInput").value.trim().toLowerCase();
        const list = document.getElementById("drugList");
        list.replaceChildren();

        const visibleDrugs = drugCache.filter(doc => {
          const searchableText = SEARCH_FIELDS
            .map(field => String(doc.data?.[field] || ""))
            .join(" ")
            .toLowerCase();
          return searchableText.includes(keyword);
        });

        visibleDrugs.forEach(doc => {
          const data = doc.data || {};
          const row = document.createElement("tr");

          const selectCell = document.createElement("td");
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.dataset.id = doc.id;
          checkbox.checked = selectedIds.has(doc.id);
          checkbox.setAttribute("aria-label", `選取 ${data.name || "藥物"}`);
          checkbox.addEventListener("change", () => toggleSelect(doc.id, checkbox.checked));
          selectCell.appendChild(checkbox);
          row.appendChild(selectCell);

          row.appendChild(createPhotoCell(data));
          SEARCH_FIELDS.forEach(field => appendTextCell(row, data[field]));

          const actionsCell = document.createElement("td");
          const actions = document.createElement("div");
          actions.className = "d-flex justify-content-center gap-1 flex-wrap";

          const editButton = document.createElement("button");
          editButton.type = "button";
          editButton.className = "btn btn-sm btn-warning";
          editButton.textContent = "修改";
          editButton.addEventListener("click", () => editDrug(doc.id));

          const deleteButton = document.createElement("button");
          deleteButton.type = "button";
          deleteButton.className = "btn btn-sm btn-danger";
          deleteButton.textContent = "刪除";
          deleteButton.addEventListener("click", () => deleteDrug(doc.id));

          const qrButton = document.createElement("button");
          qrButton.type = "button";
          qrButton.className = "btn btn-sm btn-outline-success";
          qrButton.textContent = "手機上傳";
          qrButton.addEventListener("click", () => startQrUploadForDrug(doc.id, data.name));

          actions.append(qrButton, editButton, deleteButton);

      function createEditField(labelText, id, value) {

      async function editDrug(id) {
        const drug = drugCache.find(doc => doc.id === id);
        if (!drug) return;
        const data = drug.data || {};

        const editForm = document.createElement("div");
        const editFields = {
          name: createEditField("藥名（必填）", "swal-name", data.name),
          indication: createEditField("適應症", "swal-indication", data.indication),
          sideEffect: createEditField("副作用", "swal-side", data.sideEffect),
          specialInstruction: createEditField("特殊用藥指示", "swal-special", data.specialInstruction),
          storage: createEditField("保存方式", "swal-storage", data.storage),
          emergencyGuideline: createEditField("應急時機", "swal-emergency", data.emergencyGuideline)
        };
        Object.values(editFields).forEach(field => editForm.appendChild(field.group));

        const imageGroup = document.createElement("div");
        imageGroup.className = "text-start mt-3";
        const imageLabel = document.createElement("label");
        imageLabel.className = "form-label";
        imageLabel.htmlFor = "swal-image";
        imageLabel.textContent = "藥物照片";

        const imagePreview = document.createElement("img");
        imagePreview.className = "edit-image-preview d-block mb-2";
        imagePreview.alt = "藥物照片預覽";

        const imageInput = document.createElement("input");
        imageInput.id = "swal-image";
        imageInput.type = "file";
        imageInput.className = "form-control";
        imageInput.accept = "image/jpeg,image/png,image/webp";

        const removeWrap = document.createElement("div");
        removeWrap.className = "form-check mt-2";
        const removeInput = document.createElement("input");
        removeInput.id = "swal-remove-image";
        removeInput.type = "checkbox";
        removeInput.className = "form-check-input";
        const removeLabel = document.createElement("label");
        removeLabel.className = "form-check-label";
        removeLabel.htmlFor = "swal-remove-image";
        removeLabel.textContent = "移除目前照片";
        removeWrap.append(removeInput, removeLabel);

        const imageStatus = document.createElement("div");
        imageStatus.className = "form-text";
        imageStatus.setAttribute("role", "status");
        imageStatus.setAttribute("aria-live", "polite");
        imageGroup.append(imageLabel, imagePreview, imageInput, removeWrap, imageStatus);
        editForm.appendChild(imageGroup);

        const originalImageData = getDrugImage(data);
        let editImageData = originalImageData;
        let lastNonRemovedImageData = originalImageData;
        let editImageProcessing = false;
        let editImageToken = 0;

        const updateEditPreview = () => {
          if (editImageData) imagePreview.src = editImageData;
          else imagePreview.removeAttribute("src");
          imagePreview.hidden = !editImageData;
          removeWrap.hidden = !editImageData && !lastNonRemovedImageData;
        };
        updateEditPreview();

        imageInput.addEventListener("change", async () => {
          const file = imageInput.files?.[0];
          if (!file) return;
          const token = ++editImageToken;
          const previousImageData = editImageData;
          editImageProcessing = true;
          imageStatus.className = "form-text";
          imageStatus.textContent = "正在處理照片…";
          const confirmButton = Swal.getConfirmButton();
          if (confirmButton) confirmButton.disabled = true;

          try {
            const result = await compressImage(file);
            if (token !== editImageToken) return;
            editImageData = result.dataUrl;
            lastNonRemovedImageData = result.dataUrl;
            removeInput.checked = false;
            imageStatus.textContent =
              `已壓縮為 ${result.width} × ${result.height}（約 ${formatBytes(result.bytes)}）`;
            updateEditPreview();
          } catch (error) {
            if (token !== editImageToken) return;
            imageInput.value = "";
            editImageData = previousImageData;
            imageStatus.className = "small text-danger mt-1";
            imageStatus.textContent = friendlyError(error);
            updateEditPreview();
          } finally {
            if (token === editImageToken) {
              editImageProcessing = false;
              const currentConfirmButton = Swal.getConfirmButton();
              if (currentConfirmButton) currentConfirmButton.disabled = false;
            }
          }
        });

        removeInput.addEventListener("change", () => {
          editImageToken += 1;
          editImageProcessing = false;
          imageInput.value = "";
          imageStatus.className = "form-text";
          imageStatus.textContent = "";
          editImageData = removeInput.checked ? "" : lastNonRemovedImageData;
          updateEditPreview();
        });

        const result = await Swal.fire({
          title: "修改藥物",
          html: editForm,
          width: 640,
          focusConfirm: false,
          showCancelButton: true,
          confirmButtonText: "儲存",
          cancelButtonText: "取消",
          showLoaderOnConfirm: true,
          allowOutsideClick: () => !Swal.isLoading(),
          preConfirm: async () => {
            if (editImageProcessing) {
              Swal.showValidationMessage("照片仍在處理中，請稍候。");
              return false;
            }

            const updateData = {
              name: editFields.name.input.value.trim(),
              indication: editFields.indication.input.value.trim(),
              sideEffect: editFields.sideEffect.input.value.trim(),
              specialInstruction: editFields.specialInstruction.input.value.trim(),
              storage: editFields.storage.input.value.trim(),
              emergencyGuideline: editFields.emergencyGuideline.input.value.trim(),
              image: editImageData
            };

            if (!updateData.name) {
              Swal.showValidationMessage("請至少填寫藥名。");
              return false;
            }

            try {
              await drugsRef.doc(id).update(updateData);
              return updateData;
            } catch (error) {
              console.error("修改藥物失敗", error);
              Swal.showValidationMessage(friendlyError(error));
              return false;
            }
          }
        });

        if (result.isConfirmed) await Swal.fire("修改成功", "", "success");
      }

      async function deleteDrug(id) {
        const result = await Swal.fire({
          title: "確定刪除？",
          text: "藥物資料與照片都會一併刪除，且無法復原。",
          icon: "warning",
          showCancelButton: true,
          confirmButtonText: "刪除",
          cancelButtonText: "取消",
          confirmButtonColor: "#dc3545"
        });

        if (!result.isConfirmed) return;
        try {
          await drugsRef.doc(id).delete();
          selectedIds.delete(id);
          await Swal.fire("已刪除", "", "success");
        } catch (error) {
          console.error("刪除藥物失敗", error);
          await Swal.fire("刪除失敗", friendlyError(error), "error");
        }
      }

      function subscribeToDrugs() {
        return drugsRef.orderBy("name").onSnapshot(snapshot => {
          drugCache = [];
          snapshot.forEach(doc => drugCache.push({ id: doc.id, data: doc.data() }));
          const currentIds = new Set(drugCache.map(doc => doc.id));
          selectedIds = new Set([...selectedIds].filter(id => currentIds.has(id)));
          renderDrugs();
        }, error => {
          console.error("讀取藥物清單失敗", error);
          Swal.fire("讀取失敗", friendlyError(error), "error");
        });
      }

      async function initializeApplication() {
        const bootstrap = window.__qrUploadBootstrap || null;
        delete window.__qrUploadBootstrap;
        if (bootstrap?.sessionId) {
          await initializeMobileQrUpload(bootstrap.sessionId, bootstrap.encodedKey);
          return;
        }
        subscribeToDrugs();
      }

      initializeApplication();

      function appendPdfCell(row, value) {
        const cell = document.createElement("td");
        cell.style.padding = "4px";
        cell.textContent = value == null ? "" : String(value);
        row.appendChild(cell);
      }

      async function waitForImages(container) {
        const images = [...container.querySelectorAll("img")];
        await Promise.all(images.map(image => {
          if (image.complete) return image.decode ? image.decode().catch(() => undefined) : Promise.resolve();
          return new Promise(resolve => {
            image.addEventListener("load", resolve, { once: true });
            image.addEventListener("error", resolve, { once: true });
          });
        }));
      }

      async function exportPDF() {
        const selectedDrugs = drugCache.filter(doc => selectedIds.has(doc.id));
        if (selectedDrugs.length === 0) {
          return Swal.fire("未勾選", "請至少勾選一筆藥品。", "info");
        }

        const temp = document.createElement("div");
        temp.style.position = "fixed";
        temp.style.left = "-10000px";
        temp.style.top = "0";
        temp.style.padding = "10px";
        temp.style.fontFamily = "'Noto Sans TC', sans-serif";
        temp.style.width = "794px";
        temp.style.background = "white";
        temp.style.color = "black";

        const heading = document.createElement("div");
        heading.style.textAlign = "center";
        heading.style.marginBottom = "10px";
        const logo = document.createElement("img");
        logo.src = "imgs/專心logo.png";
        logo.alt = "專心動物醫院標誌";
        logo.style.maxHeight = "60px";
        logo.style.marginRight = "8px";
        heading.append(logo, document.createTextNode("專心動物醫院"));

        const address = document.createElement("div");
        address.style.cssText = "text-align:center;font-size:15px;margin-bottom:10px;";
        address.textContent = "地址：台北市中正區仁愛路一段47號  電話：02-23633016";

        const printedAt = document.createElement("div");
        printedAt.style.cssText = "text-align:left;font-size:13px;margin-bottom:10px;";
        printedAt.textContent = `列印時間：${new Date().toLocaleString("zh-TW", { hour12: false })}`;

        const table = document.createElement("table");
        table.style.cssText = "width:100%;border-collapse:collapse;font-size:13px;";
        table.setAttribute("border", "1");
        const tableHead = document.createElement("thead");
        tableHead.style.background = "#eee";
        const headingRow = document.createElement("tr");
        ["照片", "藥名", "適應症", "副作用", "特殊用藥指示", "保存方式", "應急時機"].forEach(label => {
          const cell = document.createElement("th");
          cell.style.padding = "4px";
          cell.textContent = label;
          headingRow.appendChild(cell);
        });
        tableHead.appendChild(headingRow);

        const tableBody = document.createElement("tbody");
        selectedDrugs.forEach(drug => {
          const data = drug.data || {};
          const row = document.createElement("tr");
          const photoCell = document.createElement("td");
          photoCell.style.cssText = "padding:4px;text-align:center;width:70px;";
          const source = getDrugImage(data);
          if (source.startsWith("data:image/")) {
            const image = document.createElement("img");
            image.src = source;
            image.alt = `${data.name || "藥物"}照片`;
            image.style.cssText = "width:60px;height:60px;object-fit:cover;";
            photoCell.appendChild(image);
          } else {
            photoCell.textContent = source ? "有照片" : "無照片";
          }
          row.appendChild(photoCell);
          SEARCH_FIELDS.forEach(field => appendPdfCell(row, data[field]));
          tableBody.appendChild(row);
        });
        table.append(tableHead, tableBody);

        const footer = document.createElement("div");
        footer.style.cssText = "text-align:right;font-size:10px;margin-top:10px;";
        footer.textContent = "© 酷哥阿邱";
        temp.append(heading, address, printedAt, table, footer);
        document.body.appendChild(temp);

        Swal.fire({
          title: "正在製作 PDF…",
          allowOutsideClick: false,
          didOpen: () => Swal.showLoading()
        });

        try {
          await waitForImages(temp);
          const canvas = await html2canvas(temp, { scale: 2, backgroundColor: "#ffffff", useCORS: true });
          const imageData = canvas.toDataURL("image/jpeg", 0.92);
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF();
          const margin = 10;
          const pageWidth = pdf.internal.pageSize.getWidth();
          const pageHeight = pdf.internal.pageSize.getHeight();
          const renderWidth = pageWidth - margin * 2;
          const renderHeight = canvas.height * renderWidth / canvas.width;
          const usableHeight = pageHeight - margin * 2;

          let remainingHeight = renderHeight;
          let position = margin;
          pdf.addImage(imageData, "JPEG", margin, position, renderWidth, renderHeight);
          remainingHeight -= usableHeight;
          while (remainingHeight > 0) {
            pdf.addPage();
            position = margin - (renderHeight - remainingHeight);
            pdf.addImage(imageData, "JPEG", margin, position, renderWidth, renderHeight);
            remainingHeight -= usableHeight;
          }
          pdf.save("勾選藥物清單.pdf");
          Swal.close();
        } catch (error) {
          console.error("匯出 PDF 失敗", error);
          Swal.fire("匯出失敗", friendlyError(error), "error");
        } finally {
          temp.remove();
        }
      }
    </script>
  </div>
</body>
